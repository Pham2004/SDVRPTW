name: Run Experiment 400

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/run_400.yml'

jobs:
  run-400:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Experiment 400
        run: |
          python python_src/main.py datasets/h400_new 5
        env:
          LOG_MAIN: result.log
          LOG_HEU: result.log
          LOG_GP: result.log
          LOG_LASTPOP: result.log
          LOG_LASTROUTE: result.log

      - name: Aggregate Results
        run: |
          python aggregate_results.py result.log summary_h400.csv

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: results-400
          path: |
            result.log
            summary_h400.csv
